<!doctype html>
<html lang="en" class="scroll-smooth theme-light" data-theme="light">
  <head>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pixel_theme');
          if (saved === 'charcoal') {
            document.documentElement.classList.remove('theme-light');
            document.documentElement.classList.add('theme-dark');
            document.documentElement.setAttribute('data-theme', 'charcoal');
          } else {
            document.documentElement.classList.add('theme-light');
            document.documentElement.classList.remove('theme-dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Design and Digital Marketing Oman | Pixel</title>
    <meta name="description" content="Explore website design, SEO, Google Business Profile, social media, AI visibility and QR menus for businesses in Oman. Discuss your project with Pixel." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F4EF] text-[#202124] selection:bg-[#F5C542] selection:text-[#202124] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
