[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "rm -f package-lock.json",
  "NODE_ENV=development npm install --include=dev",
  "NODE_ENV=development npm install --force --no-save @rolldown/binding-linux-x64-gnu@1.2.15"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx --yes serve -s dist -l 80"
